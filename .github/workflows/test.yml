# Build and run the API tests (tests/*.test.mjs) on every push and pull request, against a
# fresh SQLite database with small fixtures. No real data or secrets are involved: every
# secret below is random and made up for the run.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:${{ github.workspace }}/ci.db
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://localhost:3005
      PORT: "3005"
      TEST_BASE_URL: http://localhost:3005
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Random secrets for this run
        run: |
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "NIGHT_RUN_SYNC_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "XOVER_SYNC_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "NOTIFY_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - name: Database (migrations, admin, test fixtures)
        run: |
          node scripts/migrate.js
          node prisma/seed.js
          node tests/ci-fixtures.cjs
      - run: npm run build
      - name: Start the app
        run: |
          npx next start -p 3005 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3005/login && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: npm test
      - name: Server log
        if: failure()
        run: tail -100 server.log
